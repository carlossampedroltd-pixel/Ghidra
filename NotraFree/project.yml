# XcodeGen spec. Generates two apps that share all code:
#   NotraFreeProMax  – iPhone 17 Pro Max (standard single-column layout)
#   NotraFreeDuo     – iPhone Duo (split view when unfolded; built with the DUO flag)
# Personal settings (Team ID, bundle prefix, Google client IDs) live in Config/*.xcconfig.
#   brew install xcodegen && cd NotraFree && xcodegen generate && open NotraFree.xcodeproj
name: NotraFree
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
targetTemplates:
  NotraFreeApp:
    type: application
    platform: iOS
    sources: [NotraFree]
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      base:
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: NotraFree/Info.plist
        CODE_SIGN_STYLE: Automatic
targets:
  NotraFreeProMax:
    templates: [NotraFreeApp]
    configFiles:
      Debug: Config/ProMax.xcconfig
      Release: Config/ProMax.xcconfig
  NotraFreeDuo:
    templates: [NotraFreeApp]
    configFiles:
      Debug: Config/Duo.xcconfig
      Release: Config/Duo.xcconfig
