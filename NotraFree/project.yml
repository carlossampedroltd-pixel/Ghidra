# XcodeGen spec — generate the Xcode project with:
#   brew install xcodegen && cd NotraFree && xcodegen generate && open NotraFree.xcodeproj
name: NotraFree
options:
  bundleIdPrefix: com.example.notrafree
  deploymentTarget:
    iOS: "17.0"
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
targets:
  NotraFree:
    type: application
    platform: iOS
    sources: [NotraFree]
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.notrafree
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: NotraFree/Info.plist
        CODE_SIGN_STYLE: Automatic
